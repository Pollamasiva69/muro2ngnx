# ==============================================================================
# NGINX ENTERPRISE-GRADE CONFIGURATION
# Optimized for high-performance, security, and scalability
# ==============================================================================

# Run as www-data user
user www-data;

# Worker processes - auto-detect CPU cores (or set manually for pinning)
worker_processes auto;

# Worker CPU affinity - bind each worker to a specific CPU core
worker_cpu_affinity auto;

# Maximum number of open files per worker process
worker_rlimit_nofile 1000000;

# Error log configuration
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Load dynamic modules
load_module modules/ngx_http_modsecurity_module.so;
load_module modules/ngx_http_geoip2_module.so;

# ==============================================================================
# EVENTS BLOCK - Connection processing
# ==============================================================================
events {
    # Use epoll for Linux (most efficient method)
    use epoll;

    # Maximum number of simultaneous connections per worker
    # Total connections = worker_processes * worker_connections
    worker_connections 65535;

    # Accept as many connections as possible
    multi_accept on;

    # Optimize for high-load scenarios
    accept_mutex off;
}

# ==============================================================================
# HTTP BLOCK - Main HTTP configuration
# ==============================================================================
http {
    # ----------------------------------------------------------------------
    # Basic Settings
    # ----------------------------------------------------------------------
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Server tokens - hide Nginx version
    server_tokens off;

    # Charset
    charset utf-8;

    # ----------------------------------------------------------------------
    # Performance Optimizations
    # ----------------------------------------------------------------------

    # Sendfile - use kernel sendfile() for static files
    sendfile on;

    # TCP optimizations
    tcp_nopush on;      # Send headers in one packet
    tcp_nodelay on;     # Don't buffer data-sends (good for small bursts)

    # Keepalive settings
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Reset timed out connections
    reset_timedout_connection on;

    # ----------------------------------------------------------------------
    # Buffer Settings - Optimized for high throughput
    # ----------------------------------------------------------------------

    client_body_buffer_size 128k;
    client_max_body_size 10m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # Output buffering
    output_buffers 4 32k;
    postpone_output 1460;

    # Fastcgi buffers (for PHP/backend)
    fastcgi_buffer_size 128k;
    fastcgi_buffers 256 16k;
    fastcgi_busy_buffers_size 256k;
    fastcgi_temp_file_write_size 256k;
    fastcgi_read_timeout 300;

    # Proxy buffers (for reverse proxy)
    proxy_buffer_size 128k;
    proxy_buffers 256 16k;
    proxy_busy_buffers_size 256k;
    proxy_temp_file_write_size 256k;
    proxy_read_timeout 300;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;

    # ----------------------------------------------------------------------
    # Open File Cache - Reduce I/O operations
    # ----------------------------------------------------------------------

    open_file_cache max=200000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # ----------------------------------------------------------------------
    # Timeouts
    # ----------------------------------------------------------------------

    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # ----------------------------------------------------------------------
    # Gzip Compression
    # ----------------------------------------------------------------------

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/xhtml+xml
        application/x-font-ttf
        application/x-font-opentype
        application/vnd.ms-fontobject
        image/svg+xml
        image/x-icon;
    gzip_disable "msie6";
    gzip_min_length 256;
    gzip_buffers 16 8k;

    # Brotli compression (if module available)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ----------------------------------------------------------------------
    # SSL/TLS Settings - Enterprise-grade security
    # ----------------------------------------------------------------------

    # SSL protocols - TLS 1.2 and 1.3 only
    ssl_protocols TLSv1.2 TLSv1.3;

    # Strong ciphers - prioritize modern, secure ciphers
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;  # Let client choose (better for TLS 1.3)

    # SSL session cache - improve performance
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;  # Disable for perfect forward secrecy

    # OCSP stapling - verify certificate validity
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/nginx/ssl/ca-bundle.crt;
    resolver 8.8.8.8 8.8.4.4 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # DH parameters for DHE ciphers
    ssl_dhparam /etc/nginx/ssl/dhparam.pem;

    # ----------------------------------------------------------------------
    # HTTP/2 and HTTP/3 Settings
    # ----------------------------------------------------------------------

    # HTTP/2 settings
    http2_max_field_size 16k;
    http2_max_header_size 32k;
    http2_max_requests 10000;

    # HTTP/3 settings (if QUIC module available)
    # quic_retry on;
    # http3_max_concurrent_streams 128;

    # ----------------------------------------------------------------------
    # Security Headers (default for all sites)
    # ----------------------------------------------------------------------

    # HSTS - Force HTTPS (31536000 = 1 year)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Prevent clickjacking
    add_header X-Frame-Options "DENY" always;

    # Prevent MIME sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # XSS Protection (legacy, but still useful)
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions Policy (formerly Feature-Policy)
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

    # Content Security Policy (strict default, override per site)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ----------------------------------------------------------------------
    # Logging - Structured JSON format for parsing
    # ----------------------------------------------------------------------

    log_format json_combined escape=json
    '{'
        '"timestamp":"$time_iso8601",'
        '"client_ip":"$remote_addr",'
        '"request_id":"$request_id",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"query_string":"$query_string",'
        '"status":$status,'
        '"response_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"body_bytes_sent":$body_bytes_sent,'
        '"bytes_sent":$bytes_sent,'
        '"request_length":$request_length,'
        '"user_agent":"$http_user_agent",'
        '"referer":"$http_referer",'
        '"host":"$host",'
        '"server_name":"$server_name",'
        '"scheme":"$scheme",'
        '"http_version":"$server_protocol",'
        '"ssl_protocol":"$ssl_protocol",'
        '"ssl_cipher":"$ssl_cipher",'
        '"country":"$geoip2_data_country_code",'
        '"city":"$geoip2_data_city_name",'
        '"threat_score":"$threat_score",'
        '"blocked":"$blocked",'
        '"block_reason":"$block_reason",'
        '"cache_status":"$upstream_cache_status",'
        '"connection":"$connection",'
        '"connection_requests":$connection_requests'
    '}';

    access_log /var/log/nginx/access.log json_combined buffer=32k flush=5s;

    # ----------------------------------------------------------------------
    # Rate Limiting Zones - Multi-level protection
    # ----------------------------------------------------------------------

    # Shared memory zone for rate limiting by IP
    # Global rate limit: 1000 req/s per IP (burst 2000)
    limit_req_zone $binary_remote_addr zone=global_limit:50m rate=1000r/s;

    # API endpoints: 100 req/s per IP (burst 200)
    limit_req_zone $binary_remote_addr zone=api_limit:30m rate=100r/s;

    # Login endpoints: 5 req/s per IP (burst 10)
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

    # Connection limiting: Max 20 concurrent connections per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Rate limit status code
    limit_req_status 429;
    limit_conn_status 429;

    # ----------------------------------------------------------------------
    # Proxy Cache Settings
    # ----------------------------------------------------------------------

    # Cache path with 2-level directory structure
    # Max size: 10GB, inactive: 60 minutes, keys_zone: 100MB
    proxy_cache_path /var/cache/nginx/proxy
        levels=1:2
        keys_zone=proxy_cache:100m
        max_size=10g
        inactive=60m
        use_temp_path=off;

    # Microcache zone (1-5 seconds for dynamic content)
    proxy_cache_path /var/cache/nginx/microcache
        levels=1:2
        keys_zone=microcache:10m
        max_size=1g
        inactive=10m
        use_temp_path=off;

    # Cache key
    proxy_cache_key "$scheme$request_method$host$request_uri$is_args$args";

    # Cache locking - prevent thundering herd
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_lock_age 5s;

    # Cache use stale content if backend is down
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;

    # Cache revalidation
    proxy_cache_revalidate on;

    # ----------------------------------------------------------------------
    # GeoIP2 Configuration
    # ----------------------------------------------------------------------

    geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb {
        auto_reload 5m;
        $geoip2_metadata_country_build metadata build_epoch;
        $geoip2_data_country_code country iso_code;
        $geoip2_data_country_name country names en;
    }

    geoip2 /usr/share/GeoIP/GeoLite2-City.mmdb {
        auto_reload 5m;
        $geoip2_data_city_name city names en;
        $geoip2_data_postal_code postal code;
        $geoip2_data_latitude location latitude;
        $geoip2_data_longitude location longitude;
        $geoip2_data_state_name subdivisions 0 names en;
    }

    # ----------------------------------------------------------------------
    # Variables for Lua scripts
    # ----------------------------------------------------------------------

    # Initialize variables
    map $http_user_agent $is_bot {
        default 0;
        ~*bot 1;
        ~*crawl 1;
        ~*spider 1;
        ~*slurp 1;
    }

    # Default threat score
    map $remote_addr $threat_score {
        default "0";
    }

    # Default blocked status
    map $remote_addr $blocked {
        default "false";
    }

    # Default block reason
    map $remote_addr $block_reason {
        default "";
    }

    # ----------------------------------------------------------------------
    # Lua Settings
    # ----------------------------------------------------------------------

    # Lua package path
    lua_package_path "/etc/nginx/lua/?.lua;;";

    # Shared dictionary for Lua scripts (100MB)
    lua_shared_dict threat_scores 100m;
    lua_shared_dict blacklist 50m;
    lua_shared_dict whitelist 10m;
    lua_shared_dict rate_limit 100m;
    lua_shared_dict challenge 50m;
    lua_shared_dict sessions 50m;

    # DNS resolver for Lua
    resolver 8.8.8.8 8.8.4.4;

    # Lua code cache (on for production, off for development)
    lua_code_cache on;

    # ----------------------------------------------------------------------
    # ModSecurity WAF
    # ----------------------------------------------------------------------

    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsecurity/main.conf;

    # ----------------------------------------------------------------------
    # Real IP Configuration (if behind load balancer/CDN)
    # ----------------------------------------------------------------------

    # Uncomment if behind CloudFlare, AWS ELB, etc.
    # set_real_ip_from 173.245.48.0/20;  # CloudFlare IPs
    # set_real_ip_from 10.0.0.0/8;       # Private networks
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    # ----------------------------------------------------------------------
    # Upstream Backend Servers
    # ----------------------------------------------------------------------

    upstream backend {
        # Load balancing method: least_conn, ip_hash, hash, random
        least_conn;

        # Keepalive connections to backend
        keepalive 100;
        keepalive_timeout 60s;
        keepalive_requests 1000;

        # Backend servers (example)
        server 127.0.0.1:8080 max_fails=3 fail_timeout=30s weight=1;
        server 127.0.0.1:8081 max_fails=3 fail_timeout=30s weight=1 backup;

        # Health checks (if commercial Nginx)
        # health_check interval=5s fails=2 passes=3;
    }

    # ML Service upstream
    upstream ml_service {
        server 127.0.0.1:9000 max_fails=2 fail_timeout=10s;
        keepalive 50;
    }

    # Redis upstream (for Lua)
    upstream redis {
        server 127.0.0.1:6379 max_fails=2 fail_timeout=10s;
        keepalive 100;
    }

    # ----------------------------------------------------------------------
    # Include Virtual Hosts
    # ----------------------------------------------------------------------

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
