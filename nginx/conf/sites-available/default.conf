# ==============================================================================
# NGINX VIRTUAL HOST - ENTERPRISE SECURITY CONFIGURATION
# Multi-layered protection with rate limiting, WAF, caching, and ML integration
# ==============================================================================

# ------------------------------------------------------------------------------
# Redirect HTTP to HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# Main HTTPS Server
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;

    # Enable HTTP/3 (QUIC) if module available
    # listen 443 quic reuseport;
    # add_header Alt-Svc 'h3=":443"; ma=86400';

    server_name yourdomain.com www.yourdomain.com;

    # Document root
    root /var/www/html;
    index index.html index.htm index.php;

    # ----------------------------------------------------------------------
    # SSL/TLS Configuration
    # ----------------------------------------------------------------------

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # SSL session settings (inherited from main config)
    # Additional HSTS header (if needed to override)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ----------------------------------------------------------------------
    # Connection and Rate Limiting
    # ----------------------------------------------------------------------

    # Limit concurrent connections per IP
    limit_conn conn_limit 20;

    # Global rate limit (applied to most requests)
    limit_req zone=global_limit burst=2000 nodelay;

    # ----------------------------------------------------------------------
    # Access Control
    # ----------------------------------------------------------------------

    # Deny access to hidden files (except .well-known)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to backup files
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ----------------------------------------------------------------------
    # GeoIP Blocking (example - block specific countries)
    # ----------------------------------------------------------------------

    # Uncomment to block specific countries
    # if ($geoip2_data_country_code ~ (CN|RU|KP)) {
    #     return 403 "Access denied from your country";
    # }

    # ----------------------------------------------------------------------
    # Lua-based Security Layer
    # ----------------------------------------------------------------------

    # Check whitelist/blacklist and get threat score from ML service
    access_by_lua_file /etc/nginx/lua/access_control.lua;

    # ----------------------------------------------------------------------
    # ModSecurity WAF (enabled globally in main config)
    # ----------------------------------------------------------------------

    # ModSecurity is active for all locations
    # Can be disabled for specific locations if needed:
    # modsecurity off;

    # ----------------------------------------------------------------------
    # Static Files - High-performance caching
    # ----------------------------------------------------------------------

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;

        # Open file cache helps here
        open_file_cache_valid 1h;
    }

    location ~* \.(css|js|woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(pdf|doc|docx|xls|xlsx|zip|tar|gz)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # ----------------------------------------------------------------------
    # API Endpoints - Stricter rate limiting + ML verification
    # ----------------------------------------------------------------------

    location /api/ {
        # API-specific rate limit (100 req/s per IP)
        limit_req zone=api_limit burst=200 nodelay;

        # Additional security headers for API
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        # Validate request with ML service
        auth_request /ml_verify;
        auth_request_set $threat_score $upstream_http_x_threat_score;

        # Log threat score
        access_by_lua_block {
            ngx.var.threat_score = ngx.var.threat_score or "0"
        }

        # Proxy to backend
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Disable caching for API
        proxy_cache_bypass 1;
        proxy_no_cache 1;
    }

    # ----------------------------------------------------------------------
    # Login/Authentication Endpoints - Maximum security
    # ----------------------------------------------------------------------

    location ~ ^/(login|signin|authenticate|auth|register|signup)$ {
        # Very strict rate limit (5 req/s per IP)
        limit_req zone=login_limit burst=10 delay=5;

        # Challenge suspicious IPs
        access_by_lua_file /etc/nginx/lua/challenge.lua;

        # Validate with ML service
        auth_request /ml_verify;

        # Proxy to backend
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # No caching for auth endpoints
        proxy_cache_bypass 1;
        proxy_no_cache 1;
    }

    # ----------------------------------------------------------------------
    # Internal location for ML service verification
    # ----------------------------------------------------------------------

    location = /ml_verify {
        internal;

        proxy_pass http://ml_service/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        # Pass necessary headers to ML service
        proxy_set_header X-Client-IP $remote_addr;
        proxy_set_header X-User-Agent $http_user_agent;
        proxy_set_header X-Request-URI $request_uri;
        proxy_set_header X-Request-Method $request_method;
        proxy_set_header X-SSL-Protocol $ssl_protocol;
        proxy_set_header X-SSL-Cipher $ssl_cipher;
        proxy_set_header X-Country $geoip2_data_country_code;

        # Timeout settings
        proxy_connect_timeout 100ms;
        proxy_read_timeout 100ms;
        proxy_send_timeout 100ms;
    }

    # ----------------------------------------------------------------------
    # Admin Panel - Restricted access
    # ----------------------------------------------------------------------

    location /admin/ {
        # IP whitelist (example)
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        # Additional authentication
        auth_basic "Restricted Area";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # Rate limiting
        limit_req zone=api_limit burst=50 nodelay;

        # Proxy to backend
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------------------
    # Health Check Endpoint
    # ----------------------------------------------------------------------

    location /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    location /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","timestamp":"$time_iso8601"}';
    }

    # ----------------------------------------------------------------------
    # Cache Status Endpoint (for monitoring)
    # ----------------------------------------------------------------------

    location /nginx_status {
        stub_status on;
        access_log off;

        # Restrict to localhost
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }

    # ----------------------------------------------------------------------
    # Prometheus Metrics Endpoint
    # ----------------------------------------------------------------------

    location /metrics {
        # Restrict to monitoring servers
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;

        content_by_lua_file /etc/nginx/lua/metrics.lua;
    }

    # ----------------------------------------------------------------------
    # Main Application - Microcaching for dynamic content
    # ----------------------------------------------------------------------

    location / {
        # Try files first, then proxy to backend
        try_files $uri $uri/ @backend;
    }

    location @backend {
        # Microcache zone (cache dynamic content for 1-5 seconds)
        proxy_cache microcache;
        proxy_cache_valid 200 5s;
        proxy_cache_valid 404 1s;

        # Cache bypass conditions
        proxy_cache_bypass $http_cache_control $cookie_session $arg_nocache;
        proxy_no_cache $http_cache_control $cookie_session;

        # Add cache status header
        add_header X-Cache-Status $upstream_cache_status always;

        # Proxy to backend
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # Connection keep-alive
        proxy_set_header Connection "";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Additional headers
        proxy_set_header X-Country $geoip2_data_country_code;
        proxy_set_header X-City $geoip2_data_city_name;
    }

    # ----------------------------------------------------------------------
    # Challenge Page - For suspicious traffic
    # ----------------------------------------------------------------------

    location /challenge.html {
        internal;
        root /var/www/challenge;
        add_header Content-Type text/html;
    }

    # ----------------------------------------------------------------------
    # Cache Purge API (for cache invalidation)
    # ----------------------------------------------------------------------

    location ~ /purge(/.*) {
        # Restrict to localhost
        allow 127.0.0.1;
        deny all;

        proxy_cache_purge proxy_cache $scheme$request_method$host$1;
    }

    # ----------------------------------------------------------------------
    # Error Pages
    # ----------------------------------------------------------------------

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    error_page 429 /429.html;

    location = /404.html {
        root /var/www/errors;
        internal;
    }

    location = /50x.html {
        root /var/www/errors;
        internal;
    }

    location = /429.html {
        root /var/www/errors;
        internal;
    }

    # ----------------------------------------------------------------------
    # WebSocket Support (example)
    # ----------------------------------------------------------------------

    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket timeout
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ----------------------------------------------------------------------
    # Block common exploit attempts
    # ----------------------------------------------------------------------

    # Block access to sensitive files
    location ~* (\.git|\.svn|\.htaccess|\.htpasswd|\.env|\.DS_Store|composer\.json|package\.json|Gemfile) {
        deny all;
        return 404;
    }

    # Block SQL injection attempts in URL
    location ~* (union.*select|insert.*into|drop.*table|update.*set|delete.*from) {
        deny all;
        return 403;
    }

    # Block directory traversal attempts
    location ~* \.\./|\.\.\\|/\.\. {
        deny all;
        return 403;
    }
}

# ------------------------------------------------------------------------------
# Additional server block for internal services (dashboard, monitoring)
# ------------------------------------------------------------------------------
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;

    server_name yourdomain.com;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Dashboard location
    location / {
        root /var/www/dashboard;
        try_files $uri $uri/ /index.html;

        # Authentication required
        auth_basic "Dashboard Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    # Dashboard API
    location /api/ {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket for real-time updates
    location /ws {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}
