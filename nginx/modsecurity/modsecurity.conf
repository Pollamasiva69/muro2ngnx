# ==============================================================================
# ModSecurity Main Configuration File
# Enterprise-grade Web Application Firewall configuration
# ==============================================================================

# -- Rule engine initialization ----------------------------------------------

# Enable ModSecurity, attaching it to every transaction
SecRuleEngine On

# -- Request body handling ---------------------------------------------------

# Allow ModSecurity to access request bodies
SecRequestBodyAccess On

# Maximum request body size (10MB)
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072

# What to do if the request body size exceeds limit
SecRequestBodyLimitAction Reject

# Store up to 128 KB in memory
SecRequestBodyInMemoryLimit 131072

# Verify that we've correctly processed the request body
SecRule REQBODY_ERROR "!@eq 0" \
"id:'200001', phase:2,t:none,log,deny,status:400,msg:'Failed to parse request body.',logdata:'%{reqbody_error_msg}',severity:2"

# By default be strict with what we accept in the multipart/form-data request body
SecRule MULTIPART_STRICT_ERROR "!@eq 0" \
"id:'200002',phase:2,t:none,log,deny,status:400, \
msg:'Multipart request body failed strict validation: \
PE %{REQBODY_PROCESSOR_ERROR}, \
BQ %{MULTIPART_BOUNDARY_QUOTED}, \
BW %{MULTIPART_BOUNDARY_WHITESPACE}, \
DB %{MULTIPART_DATA_BEFORE}, \
DA %{MULTIPART_DATA_AFTER}, \
HF %{MULTIPART_HEADER_FOLDING}, \
LF %{MULTIPART_LF_LINE}, \
SM %{MULTIPART_MISSING_SEMICOLON}, \
IQ %{MULTIPART_INVALID_QUOTING}, \
IP %{MULTIPART_INVALID_PART}, \
IH %{MULTIPART_INVALID_HEADER_FOLDING}, \
FL %{MULTIPART_FILE_LIMIT_EXCEEDED}'"

# Did we see anything that might be a boundary?
SecRule MULTIPART_UNMATCHED_BOUNDARY "@eq 1" \
"id:'200003',phase:2,t:none,log,deny,msg:'Multipart parser detected a possible unmatched boundary.'"

# PCRE Tuning
SecPcreMatchLimit 100000
SecPcreMatchLimitRecursion 100000

# Some internal errors will set flags in TX and we will need to look for these
SecRule TX:/^MSC_/ "!@streq 0" \
"id:'200004',phase:2,t:none,deny,msg:'ModSecurity internal error flagged: %{MATCHED_VAR_NAME}'"

# -- Response body handling --------------------------------------------------

# Allow ModSecurity to access response bodies
SecResponseBodyAccess On

# Which response MIME types do you want to inspect?
SecResponseBodyMimeType text/plain text/html text/xml application/json

# Buffer response bodies of up to 512 KB in length
SecResponseBodyLimit 524288

# What happens when we encounter a response body larger than the limit?
SecResponseBodyLimitAction ProcessPartial

# -- Filesystem configuration ------------------------------------------------

# The location where ModSecurity stores temporary files
SecTmpDir /tmp/

# The location where ModSecurity will keep its persistent data
SecDataDir /tmp/

# -- File uploads handling ---------------------------------------------------

# The location where ModSecurity stores uploaded files
SecUploadDir /tmp/

# By default, do not keep uploaded files
SecUploadKeepFiles Off

# Only allow uploads with valid Content-Type
SecUploadFileMode 0600

# -- Debug log configuration -------------------------------------------------

# Debug log level (0-9)
# 0: No logging
# 3: Info, warnings, errors
# 5: Detailed debug
# 9: Everything (very verbose)
SecDebugLog /var/log/nginx/modsec_debug.log
SecDebugLogLevel 3

# -- Audit log configuration -------------------------------------------------

# Log format: JSON for better parsing
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/nginx/modsec_audit.log

# Concurrent logging format
# SecAuditLogType Concurrent
# SecAuditLogStorageDir /var/log/nginx/audit/

# JSON audit log format
SecAuditLogFormat JSON

# -- Miscellaneous -----------------------------------------------------------

# Use the most commonly used application/x-www-form-urlencoded parameter separator
SecArgumentSeparator &

# Settle on version 0 (zero) cookies
SecCookieFormat 0

# Specify your Unicode Code Point
SecUnicodeMapFile unicode.map 20127

# -- Status engine configuration ---------------------------------------------

# Enable status engine
SecStatusEngine On

# -- Rule performance tracking -----------------------------------------------

# Enable rule performance tracking
SecRulePerfTime 1000

# -- Collection timeout ------------------------------------------------------

SecCollectionTimeout 600

# -- Response headers --------------------------------------------------------

# Server signature override
SecServerSignature "nginx"

# -- Geo IP database ---------------------------------------------------------

# SecGeoLookupDB /usr/share/GeoIP/GeoLite2-Country.mmdb

# -- Custom settings ---------------------------------------------------------

# Disable XML processing if not needed (performance optimization)
SecXmlBodyLimit 1048576

# Argument limits
SecArgumentLimit 1000

# HTTP methods allowed
SecRule REQUEST_METHOD "!@pm GET POST PUT DELETE PATCH HEAD OPTIONS" \
"id:'200005',phase:1,t:none,deny,status:405,msg:'Method not allowed'"

# -- Component signature -----------------------------------------------------

SecComponentSignature "OWASP ModSecurity Core Rule Set/4.0.0"

# -- Anomaly Scoring Mode ----------------------------------------------------

# Enable anomaly scoring mode
SecAction \
"id:900000,\
phase:1,\
nolog,\
pass,\
t:none,\
setvar:tx.anomaly_score_blocking=on"

# -- Anomaly Score Thresholds ------------------------------------------------

# Inbound anomaly score threshold
# Score to block request: 5 = strict, 10 = moderate, 20 = permissive
SecAction \
"id:900110,\
phase:1,\
nolog,\
pass,\
t:none,\
setvar:tx.inbound_anomaly_score_threshold=5"

# Outbound anomaly score threshold
SecAction \
"id:900111,\
phase:1,\
nolog,\
pass,\
t:none,\
setvar:tx.outbound_anomaly_score_threshold=4"

# -- Paranoia Level ----------------------------------------------------------

# Paranoia Level: 1 (default), 2 (moderate), 3 (strict), 4 (very strict)
# Higher levels = more rules but potentially more false positives
SecAction \
"id:900000,\
phase:1,\
nolog,\
pass,\
t:none,\
setvar:tx.paranoia_level=2"

# -- Executing Paranoia Level ------------------------------------------------

SecAction \
"id:900001,\
phase:1,\
nolog,\
pass,\
t:none,\
setvar:tx.executing_paranoia_level=2"

# -- HTTP Policy Settings ----------------------------------------------------

# Allowed HTTP versions
SecAction \
"id:900230,\
phase:1,\
nolog,\
pass,\
t:none,\
setvar:'tx.allowed_http_versions=HTTP/1.0 HTTP/1.1 HTTP/2 HTTP/2.0 HTTP/3'"

# Allowed request content types
SecAction \
"id:900220,\
phase:1,\
nolog,\
pass,\
t:none,\
setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |multipart/related| |text/xml| |application/xml| |application/soap+xml| |application/json| |application/cloudevents+json| |application/cloudevents-batch+json|'"

# Allowed HTTP methods
SecAction \
"id:900200,\
phase:1,\
nolog,\
pass,\
t:none,\
setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"

# -- File Upload Restrictions ------------------------------------------------

# Restricted file extensions
SecAction \
"id:900240,\
phase:1,\
nolog,\
pass,\
t:none,\
setvar:'tx.restricted_extensions=.asa/ .asax/ .ascx/ .axd/ .backup/ .bak/ .bat/ .cdx/ .cer/ .cfg/ .cmd/ .com/ .config/ .conf/ .cs/ .csproj/ .csr/ .dat/ .db/ .dbf/ .dll/ .dos/ .htr/ .htw/ .ida/ .idc/ .idq/ .inc/ .ini/ .key/ .licx/ .lnk/ .log/ .mdb/ .old/ .pass/ .pdb/ .pol/ .printer/ .pwd/ .rdb/ .resources/ .resx/ .sql/ .swp/ .sys/ .vb/ .vbs/ .vbproj/ .vsdisco/ .webinfo/ .xsd/ .xsx/'"

# Restricted file upload MIME types
SecAction \
"id:900250,\
phase:1,\
nolog,\
pass,\
t:none,\
setvar:'tx.restricted_upload_content_type=application/x-msdownload|application/x-executable|application/x-dosexec|application/x-ms-dos-executable|'"

# -- DoS Protection Settings -------------------------------------------------

# Block requests with too many arguments
SecAction \
"id:900300,\
phase:1,\
nolog,\
pass,\
t:none,\
setvar:tx.max_num_args=255"

# Maximum argument name length
SecAction \
"id:900310,\
phase:1,\
nolog,\
pass,\
t:none,\
setvar:tx.arg_name_length=100"

# Maximum argument value length
SecAction \
"id:900320,\
phase:1,\
nolog,\
pass,\
t:none,\
setvar:tx.arg_length=400"

# Maximum combined size of arguments
SecAction \
"id:900330,\
phase:1,\
nolog,\
pass,\
t:none,\
setvar:tx.total_arg_length=64000"

# Maximum file size (5MB)
SecAction \
"id:900340,\
phase:1,\
nolog,\
pass,\
t:none,\
setvar:tx.max_file_size=5242880"

# Maximum combined file sizes (10MB)
SecAction \
"id:900350,\
phase:1,\
nolog,\
pass,\
t:none,\
setvar:tx.combined_file_sizes=10485760"

# -- Blocking evaluation -----------------------------------------------------

# Block based on anomaly score
SecRule TX:ANOMALY_SCORE "@ge %{tx.inbound_anomaly_score_threshold}" \
"id:949110,\
phase:2,\
deny,\
status:403,\
t:none,\
msg:'Inbound Anomaly Score Exceeded (Total Score: %{TX.ANOMALY_SCORE})',\
tag:'application-multi',\
tag:'language-multi',\
tag:'platform-multi',\
tag:'attack-generic',\
ver:'OWASP_CRS/4.0.0',\
severity:'CRITICAL',\
setvar:'tx.inbound_tx_msg=%{rule.msg}',\
setvar:tx.inbound_anomaly_score=%{tx.anomaly_score}"

# -- Outbound anomaly scoring ------------------------------------------------

SecRule TX:OUTBOUND_ANOMALY_SCORE "@ge %{tx.outbound_anomaly_score_threshold}" \
"id:959100,\
phase:4,\
deny,\
status:403,\
t:none,\
msg:'Outbound Anomaly Score Exceeded (Total Score: %{TX.OUTBOUND_ANOMALY_SCORE})',\
tag:'application-multi',\
tag:'language-multi',\
tag:'platform-multi',\
tag:'attack-generic',\
ver:'OWASP_CRS/4.0.0',\
severity:'CRITICAL'"

# -- Include OWASP CRS -------------------------------------------------------

Include /etc/nginx/modsecurity/owasp-crs/crs-setup.conf
Include /etc/nginx/modsecurity/owasp-crs/rules/*.conf

# -- Include custom rules ----------------------------------------------------

Include /etc/nginx/modsecurity/rules/*.conf
