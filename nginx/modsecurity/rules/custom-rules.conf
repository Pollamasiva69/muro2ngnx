# ==============================================================================
# CUSTOM MODSECURITY RULES
# Enterprise-specific security rules for advanced threat protection
# ==============================================================================

# -- Rule ID Range: 100000-199999 (Custom Rules) ------------------------------

# ==============================================================================
# SQL INJECTION PROTECTION - Enhanced Detection
# ==============================================================================

# Detect SQL injection in query strings
SecRule ARGS "@detectSQLi" \
"id:100001,\
phase:2,\
deny,\
status:403,\
t:none,t:urlDecodeUni,t:lowercase,\
msg:'SQL Injection Attack Detected',\
logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
tag:'application-multi',\
tag:'language-sql',\
tag:'platform-multi',\
tag:'attack-sqli',\
severity:'CRITICAL',\
setvar:'tx.anomaly_score=+%{tx.critical_anomaly_score}',\
setvar:'tx.sql_injection_score=+1'"

# Detect SQL injection bypass attempts (hex encoding, unicode)
SecRule ARGS "@rx (?i)(?:\%27|\%23|\%2d\%2d|0x[0-9a-f]{2,}|\\x[0-9a-f]{2})" \
"id:100002,\
phase:2,\
deny,\
status:403,\
t:none,\
msg:'SQL Injection Bypass Attempt (Encoding)',\
logdata:'Matched Data: %{MATCHED_VAR}',\
tag:'attack-sqli',\
severity:'CRITICAL',\
setvar:'tx.anomaly_score=+%{tx.critical_anomaly_score}'"

# Detect UNION-based SQL injection
SecRule ARGS "@rx (?i)union\s+(?:all\s+)?select" \
"id:100003,\
phase:2,\
deny,\
status:403,\
t:none,t:urlDecodeUni,t:lowercase,\
msg:'UNION-based SQL Injection',\
logdata:'Matched Data: %{MATCHED_VAR}',\
tag:'attack-sqli',\
severity:'CRITICAL',\
setvar:'tx.anomaly_score=+%{tx.critical_anomaly_score}'"

# Detect time-based blind SQL injection
SecRule ARGS "@rx (?i)(?:sleep\s*\(|benchmark\s*\(|waitfor\s+delay|pg_sleep)" \
"id:100004,\
phase:2,\
deny,\
status:403,\
t:none,t:urlDecodeUni,t:lowercase,\
msg:'Time-based Blind SQL Injection',\
logdata:'Matched Data: %{MATCHED_VAR}',\
tag:'attack-sqli',\
severity:'CRITICAL',\
setvar:'tx.anomaly_score=+%{tx.critical_anomaly_score}'"

# Detect SQL comments used for injection
SecRule ARGS "@rx (?:--|#|\/\*|\*\/)" \
"id:100005,\
phase:2,\
deny,\
status:403,\
t:none,t:urlDecodeUni,\
msg:'SQL Comment Sequence Detected',\
logdata:'Matched Data: %{MATCHED_VAR}',\
tag:'attack-sqli',\
severity:'WARNING',\
setvar:'tx.anomaly_score=+%{tx.warning_anomaly_score}'"

# ==============================================================================
# XSS (CROSS-SITE SCRIPTING) PROTECTION
# ==============================================================================

# Detect XSS using libinjection
SecRule ARGS|REQUEST_COOKIES|REQUEST_HEADERS:Referer "@detectXSS" \
"id:100010,\
phase:2,\
deny,\
status:403,\
t:none,t:utf8toUnicode,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:cssDecode,t:removeNulls,\
msg:'XSS Attack Detected',\
logdata:'Matched Data: %{MATCHED_VAR}',\
tag:'attack-xss',\
severity:'CRITICAL',\
setvar:'tx.anomaly_score=+%{tx.critical_anomaly_score}',\
setvar:'tx.xss_score=+1'"

# Detect JavaScript event handlers
SecRule ARGS|REQUEST_HEADERS:Referer "@rx (?i)on(?:load|error|click|mouse|focus|blur|change|submit)\s*=" \
"id:100011,\
phase:2,\
deny,\
status:403,\
t:none,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase,\
msg:'XSS Attack - JavaScript Event Handler',\
logdata:'Matched Data: %{MATCHED_VAR}',\
tag:'attack-xss',\
severity:'CRITICAL',\
setvar:'tx.anomaly_score=+%{tx.critical_anomaly_score}'"

# Detect <script> tags (various bypass attempts)
SecRule ARGS|REQUEST_HEADERS:Referer "@rx (?i)<\s*script[^>]*>|<\/\s*script\s*>" \
"id:100012,\
phase:2,\
deny,\
status:403,\
t:none,t:urlDecodeUni,t:htmlEntityDecode,\
msg:'XSS Attack - Script Tag',\
logdata:'Matched Data: %{MATCHED_VAR}',\
tag:'attack-xss',\
severity:'CRITICAL',\
setvar:'tx.anomaly_score=+%{tx.critical_anomaly_score}'"

# Detect javascript: protocol
SecRule ARGS "@rx (?i)javascript:" \
"id:100013,\
phase:2,\
deny,\
status:403,\
t:none,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase,\
msg:'XSS Attack - JavaScript Protocol',\
logdata:'Matched Data: %{MATCHED_VAR}',\
tag:'attack-xss',\
severity:'CRITICAL',\
setvar:'tx.anomaly_score=+%{tx.critical_anomaly_score}'"

# Detect data: protocol (can be used for XSS)
SecRule ARGS "@rx (?i)data:(?:text/html|application/javascript)" \
"id:100014,\
phase:2,\
deny,\
status:403,\
t:none,t:urlDecodeUni,t:lowercase,\
msg:'XSS Attack - Data Protocol',\
logdata:'Matched Data: %{MATCHED_VAR}',\
tag:'attack-xss',\
severity:'CRITICAL',\
setvar:'tx.anomaly_score=+%{tx.critical_anomaly_score}'"

# ==============================================================================
# PATH TRAVERSAL / DIRECTORY TRAVERSAL
# ==============================================================================

# Detect ../ sequences (including encoded variants)
SecRule REQUEST_URI|ARGS "@rx (?:\.\.\/|\.\.\\|%2e%2e%2f|%2e%2e\/|\.\.%2f|%2e%2e%5c)" \
"id:100020,\
phase:2,\
deny,\
status:403,\
t:none,t:urlDecodeUni,t:lowercase,\
msg:'Path Traversal Attack',\
logdata:'Matched Data: %{MATCHED_VAR}',\
tag:'attack-traversal',\
severity:'CRITICAL',\
setvar:'tx.anomaly_score=+%{tx.critical_anomaly_score}'"

# Detect absolute path access attempts
SecRule ARGS "@rx (?:^\/etc\/|^\/proc\/|^\/sys\/|^\/dev\/|^\/var\/|^c:\\|^c%3a\\)" \
"id:100021,\
phase:2,\
deny,\
status:403,\
t:none,t:urlDecodeUni,t:lowercase,\
msg:'Absolute Path Disclosure Attempt',\
logdata:'Matched Data: %{MATCHED_VAR}',\
tag:'attack-traversal',\
severity:'CRITICAL',\
setvar:'tx.anomaly_score=+%{tx.critical_anomaly_score}'"

# Detect null byte injection
SecRule REQUEST_URI|ARGS "@contains \x00" \
"id:100022,\
phase:2,\
deny,\
status:403,\
t:none,\
msg:'Null Byte Injection Attack',\
logdata:'Matched Data: %{MATCHED_VAR}',\
tag:'attack-traversal',\
severity:'CRITICAL',\
setvar:'tx.anomaly_score=+%{tx.critical_anomaly_score}'"

# ==============================================================================
# REMOTE FILE INCLUSION (RFI)
# ==============================================================================

# Detect remote file inclusion (http://, https://, ftp://)
SecRule ARGS "@rx (?i)(?:https?|ftp):\/\/" \
"id:100030,\
phase:2,\
deny,\
status:403,\
t:none,t:urlDecodeUni,t:lowercase,\
msg:'Remote File Inclusion Attack',\
logdata:'Matched Data: %{MATCHED_VAR}',\
tag:'attack-rfi',\
severity:'CRITICAL',\
setvar:'tx.anomaly_score=+%{tx.critical_anomaly_score}'"

# Detect php:// wrappers
SecRule ARGS "@rx (?i)php:\/\/(?:input|filter|stdin|stdout)" \
"id:100031,\
phase:2,\
deny,\
status:403,\
t:none,t:urlDecodeUni,t:lowercase,\
msg:'PHP Wrapper Attack',\
logdata:'Matched Data: %{MATCHED_VAR}',\
tag:'attack-rfi',\
severity:'CRITICAL',\
setvar:'tx.anomaly_score=+%{tx.critical_anomaly_score}'"

# ==============================================================================
# COMMAND INJECTION
# ==============================================================================

# Detect shell command injection
SecRule ARGS "@rx (?:[;&|`]|\$\(|\|\||&&)" \
"id:100040,\
phase:2,\
deny,\
status:403,\
t:none,t:urlDecodeUni,\
msg:'Command Injection Attack',\
logdata:'Matched Data: %{MATCHED_VAR}',\
tag:'attack-injection-cmd',\
severity:'CRITICAL',\
setvar:'tx.anomaly_score=+%{tx.critical_anomaly_score}'"

# Detect common shell commands
SecRule ARGS "@rx (?i)(?:cat|ls|pwd|wget|curl|bash|sh|nc|netcat|chmod|chown|kill|rm)\s" \
"id:100041,\
phase:2,\
deny,\
status:403,\
t:none,t:urlDecodeUni,t:lowercase,\
msg:'Shell Command Detected',\
logdata:'Matched Data: %{MATCHED_VAR}',\
tag:'attack-injection-cmd',\
severity:'CRITICAL',\
setvar:'tx.anomaly_score=+%{tx.critical_anomaly_score}'"

# ==============================================================================
# LDAP INJECTION
# ==============================================================================

# Detect LDAP injection metacharacters
SecRule ARGS "@rx (?:\(|\)|\||&|\*)" \
"id:100050,\
phase:2,\
deny,\
status:403,\
t:none,t:urlDecodeUni,\
msg:'LDAP Injection Attack',\
logdata:'Matched Data: %{MATCHED_VAR}',\
tag:'attack-ldap',\
severity:'CRITICAL',\
setvar:'tx.anomaly_score=+%{tx.critical_anomaly_score}'"

# ==============================================================================
# XML EXTERNAL ENTITY (XXE) ATTACKS
# ==============================================================================

# Detect XXE entity declarations
SecRule REQUEST_BODY "@rx (?i)<!ENTITY[^>]+SYSTEM" \
"id:100060,\
phase:2,\
deny,\
status:403,\
t:none,\
msg:'XML External Entity (XXE) Attack',\
logdata:'Matched Data: %{MATCHED_VAR}',\
tag:'attack-xxe',\
severity:'CRITICAL',\
setvar:'tx.anomaly_score=+%{tx.critical_anomaly_score}'"

# Detect DOCTYPE with SYSTEM
SecRule REQUEST_BODY "@rx (?i)<!DOCTYPE[^>]+SYSTEM" \
"id:100061,\
phase:2,\
deny,\
status:403,\
t:none,\
msg:'XXE Attack - DOCTYPE with SYSTEM',\
logdata:'Matched Data: %{MATCHED_VAR}',\
tag:'attack-xxe',\
severity:'CRITICAL',\
setvar:'tx.anomaly_score=+%{tx.critical_anomaly_score}'"

# ==============================================================================
# SERVER-SIDE REQUEST FORGERY (SSRF)
# ==============================================================================

# Detect SSRF attempts (localhost, 127.0.0.1, internal IPs)
SecRule ARGS "@rx (?i)(?:localhost|127\.0\.0\.1|0\.0\.0\.0|::1|169\.254\.|10\.|172\.16\.|192\.168\.)" \
"id:100070,\
phase:2,\
deny,\
status:403,\
t:none,t:urlDecodeUni,t:lowercase,\
msg:'Server-Side Request Forgery (SSRF) Attempt',\
logdata:'Matched Data: %{MATCHED_VAR}',\
tag:'attack-ssrf',\
severity:'CRITICAL',\
setvar:'tx.anomaly_score=+%{tx.critical_anomaly_score}'"

# ==============================================================================
# HTTP REQUEST SMUGGLING
# ==============================================================================

# Detect Content-Length and Transfer-Encoding together (CL.TE)
SecRule &REQUEST_HEADERS:Content-Length "@eq 1" \
"id:100080,\
chain,\
phase:1,\
deny,\
status:400,\
msg:'HTTP Request Smuggling - CL.TE',\
tag:'attack-smuggling',\
severity:'CRITICAL',\
setvar:'tx.anomaly_score=+%{tx.critical_anomaly_score}'"
SecRule &REQUEST_HEADERS:Transfer-Encoding "@eq 1"

# Detect multiple Content-Length headers
SecRule &REQUEST_HEADERS:Content-Length "@gt 1" \
"id:100081,\
phase:1,\
deny,\
status:400,\
msg:'HTTP Request Smuggling - Multiple Content-Length',\
tag:'attack-smuggling',\
severity:'CRITICAL',\
setvar:'tx.anomaly_score=+%{tx.critical_anomaly_score}'"

# ==============================================================================
# SCANNER DETECTION
# ==============================================================================

# Detect common web scanners by User-Agent
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(?:nikto|nmap|masscan|sqlmap|acunetix|nessus|openvas|burp|zap|w3af|metasploit|havij)" \
"id:100090,\
phase:1,\
deny,\
status:403,\
t:none,t:lowercase,\
msg:'Security Scanner Detected',\
logdata:'User-Agent: %{MATCHED_VAR}',\
tag:'attack-scanner',\
severity:'CRITICAL',\
setvar:'tx.anomaly_score=+%{tx.critical_anomaly_score}'"

# Detect scanner patterns in requests
SecRule REQUEST_URI "@rx (?:\.\.;\/|\/\.\.\/|PHPUnit|invoker|jenkins|actuator\/)" \
"id:100091,\
phase:1,\
deny,\
status:404,\
t:none,t:urlDecodeUni,\
msg:'Scanner Probing Detected',\
logdata:'URI: %{MATCHED_VAR}',\
tag:'attack-scanner',\
severity:'WARNING',\
setvar:'tx.anomaly_score=+%{tx.warning_anomaly_score}'"

# ==============================================================================
# SESSION FIXATION
# ==============================================================================

# Detect session ID in URL (potential session fixation)
SecRule REQUEST_URI "@rx (?i)(?:sessionid|phpsessid|jsessionid|aspsessionid)=" \
"id:100100,\
phase:1,\
deny,\
status:403,\
t:none,t:urlDecodeUni,t:lowercase,\
msg:'Session Fixation Attempt',\
logdata:'URI: %{MATCHED_VAR}',\
tag:'attack-session-fixation',\
severity:'WARNING',\
setvar:'tx.anomaly_score=+%{tx.warning_anomaly_score}'"

# ==============================================================================
# FILE UPLOAD VALIDATION
# ==============================================================================

# Detect PHP file uploads (including double extension bypass)
SecRule FILES "@rx \.php[0-9]?$|\.phtml$|\.phar$" \
"id:100110,\
phase:2,\
deny,\
status:403,\
t:none,t:lowercase,\
msg:'Malicious File Upload - PHP File',\
logdata:'Filename: %{MATCHED_VAR}',\
tag:'attack-file-upload',\
severity:'CRITICAL',\
setvar:'tx.anomaly_score=+%{tx.critical_anomaly_score}'"

# Detect executable file uploads
SecRule FILES "@rx \.(?:exe|dll|bat|cmd|sh|jar|war)$" \
"id:100111,\
phase:2,\
deny,\
status:403,\
t:none,t:lowercase,\
msg:'Malicious File Upload - Executable',\
logdata:'Filename: %{MATCHED_VAR}',\
tag:'attack-file-upload',\
severity:'CRITICAL',\
setvar:'tx.anomaly_score=+%{tx.critical_anomaly_score}'"

# Verify uploaded file content matches extension (magic bytes check)
SecRule FILES_TMPNAMES "@inspectFile /etc/nginx/modsecurity/file-magic.data" \
"id:100112,\
phase:2,\
deny,\
status:403,\
msg:'File Upload - Content Type Mismatch',\
tag:'attack-file-upload',\
severity:'WARNING',\
setvar:'tx.anomaly_score=+%{tx.warning_anomaly_score}'"

# ==============================================================================
# RESPONSE SPLITTING
# ==============================================================================

# Detect CRLF injection in headers
SecRule REQUEST_HEADERS|ARGS "@rx (?:%0d%0a|\\r\\n|%0a|\\n)" \
"id:100120,\
phase:2,\
deny,\
status:403,\
t:none,t:urlDecodeUni,\
msg:'HTTP Response Splitting Attack',\
logdata:'Matched Data: %{MATCHED_VAR}',\
tag:'attack-response-splitting',\
severity:'CRITICAL',\
setvar:'tx.anomaly_score=+%{tx.critical_anomaly_score}'"

# ==============================================================================
# CUSTOM BUSINESS LOGIC RULES
# ==============================================================================

# Rate limit API endpoints (example)
# This is complementary to nginx rate limiting
SecRule REQUEST_URI "@beginsWith /api/" \
"id:100200,\
phase:1,\
pass,\
nolog,\
setvar:'tx.api_request=1'"

# Require authentication headers for API
SecRule TX:API_REQUEST "@eq 1" \
"id:100201,\
chain,\
phase:2,\
deny,\
status:401,\
msg:'API Request without Authentication',\
tag:'business-logic',\
severity:'WARNING'"
SecRule &REQUEST_HEADERS:Authorization "@eq 0"

